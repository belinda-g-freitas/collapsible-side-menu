name: collapsible_side_menu
description: "A Flutter customizable collapsible side menu with sub-menus and text direction features."
version: 3.0.0

repository: https://github.com/belinda-g-freitas/collapsible-side-menu
issue_tracker: https://github.com/belinda-g-freitas/collapsible-side-menu/issues
documentation: https://github.com/belinda-g-freitas/collapsible-side-menu
homepage: https://belinda-g-freitas.github.io/collapsible-side-menu

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

flutter:
  uses-material-design: true

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

screenshots:
  - description: 'Mobile demo gif'
    path: 'assets/collapsible_side_menu_android.gif'
  - description: 'Desktop demo gif'
    path: 'assets/collapsible_side_menu_desktop.gif'
  - description: 'Web demo png'
    path: 'assets/collapsible_side_menu_web.png'

topics:
  - menu
  - side-menu
  - collapsible-menu
  - sub-menu
  - adaptive-side-menu